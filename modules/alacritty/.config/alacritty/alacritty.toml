[general]
import = [
    "~/.config/alacritty/themes/active.toml",
    "~/.config/alacritty/local.toml",
]
live_config_reload = true
ipc_socket = true

[font]
size = 8
normal = { family = "Hack Nerd Font", style = "Regular" }

[scrolling]
history = 50000

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
    { key = "F10", mods = "Control|Shift", command = { program = "/bin/sh", args = ["-lc", "$HOME/.local/bin/alacritty-theme toggle"] } },
    { key = "F11", mods = "Control|Shift", command = { program = "/bin/sh", args = ["-lc", "$HOME/.local/bin/alacritty-theme dark"] } },
    { key = "F12", mods = "Control|Shift", command = { program = "/bin/sh", args = ["-lc", "$HOME/.local/bin/alacritty-theme light"] } },
    { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
    { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
    { key = "NumpadAdd", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
    { key = "NumpadSubtract", mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },
]

[mouse]
bindings = [
    { mouse = "Right", action = "Paste" },
]
